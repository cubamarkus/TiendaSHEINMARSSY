<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tienda SHEIN MARSSY</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="text-5xl">

    <header>
        <div class="">
            <nav class="flex items-center bg-blue-500 p-6">
                <button>
                    <img src="ICOMS/mail.svg" alt="notificaciones" class="w-15 h-15 ">
                </button>
                <div class="flex items-center">
                    <img src="ICOMS/search.svg" alt="buscador" class="w-15 h-15">
                    <textarea class="bg-red-100 w-150 h-13">Buscador</textarea>
                </div>


            </nav>
        </div>

        <div class="bg-blue-200 pb-4">
            <span>Camisas</span>
            <span>Pantalones</span>
            <span>Shorts</span>
            <span>Conjuntos</span>
            <span>vestidos</span>

        </div>

    </header>

    <main>
        <div class="bg-zinc-900 text-white p-60">
            <h1>MARSSY</h1>
        </div>

        <div class="grid grid-cols-2 gap-6 p-4" id="productos">

        </div>






        <div class="fixed bottom-0 left-0 w-full bg-white border-t">
            <nav class="flex justify-around items-center w-full">
                <button class="flex flex-col items-center p-4">
                    <img src="ICOMS/house.svg" alt="Inicio" class="w-15 h-15 ">
                    <span>Inicio</span>
                </button>
                <button class="flex flex-col items-center py-4">
                    <img src="ICOMS/search.svg" alt="Categorias" class="w-15 h-15 ">
                    <span>Categorias</span>
                </button>
                <button class="flex flex-col items-center p-4">
                    <img src="ICOMS/cart3.svg" alt="Carrito" class="w-15 h-15 ">
                    <span>Carrito</span>
                </button>
                <button class="flex flex-col items-center p-4">
                    <img src="ICOMS/person.svg" alt="Usuario" class="w-15 h-15 ">
                    <span>Yo</span>
                </button>
            </nav>
        </div>
    </main>



    <footer>

    </footer>


    <script src="script.js"></script>
</body>
</html>
